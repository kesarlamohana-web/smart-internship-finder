<!DOCTYPE html>
<html>
<head>
  <title>Admin - Add Internship</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { margin-bottom: 8px; padding: 4px; width: 320px; }
    table { border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
  </style>
</head>
<body>
  <h2>Admin: Add Internship</h2>
  <p>
    <a href="/profile">Profile</a> |
    <a href="/internships">All Internships</a> |
    <a href="/logout">Logout</a>
  </p>

  {% if message %}
    <p style="color:green">{{ message }}</p>
  {% endif %}

  <form method="POST">
    <input type="text" name="title" placeholder="Title (e.g. Web Developer Intern)" required><br>
    <input type="text" name="company" placeholder="Company" required><br>
    <input type="text" name="required_skills" placeholder="Required skills (e.g. Python,SQL)" required><br>
    <input type="text" name="location" placeholder="Location" required><br>
    <input type="text" name="duration" placeholder="Duration (e.g. 3 months)" required><br>
    <input type="text" name="stipend" placeholder="Stipend (e.g. 10000)" required><br>
    <input type="text" name="deadline" placeholder="Deadline (e.g. 2026-12-31)" required><br>
    <input type="text" name="apply_link" placeholder="Apply link (https://...)" required><br>
    <button type="submit">Add Internship</button>
  </form>

  <table>
    <tr><th>ID</th><th>Title</th><th>Company</th><th>Skills</th><th>Location</th></tr>
    {% for i in internships %}
      <tr>
        <td>{{ i['id'] }}</td>
        <td>{{ i['title'] }}</td>
        <td>{{ i['company'] }}</td>
        <td>{{ i['required_skills'] }}</td>
        <td>{{ i['location'] }}</td>
      </tr>
    {% endfor %}
  </table>
</body>
</html>
